name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    outputs:
      # "false" only for final tags like v1.2.3; anything with a suffix
      # (v1.2.3rc1, v1.2.3a1, v1.2.3b2, ...) is treated as a pre-release.
      prerelease: ${{ steps.classify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*
      - name: Classify tag (final vs pre-release)
        id: classify
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI (pre-release)
    needs: build
    runs-on: ubuntu-latest
    # Pre-release tags (e.g. v0.1.2rc1) go to TestPyPI only.
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
      && needs.build.outputs.prerelease == 'true'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pymargins
    permissions:
      id-token: write  # OIDC for Trusted Publishing; no token stored
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI (final)
    needs: build
    runs-on: ubuntu-latest
    # Final version tags (e.g. v0.1.2) go to production PyPI.
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
      && needs.build.outputs.prerelease == 'false'
    environment:
      name: pypi
      url: https://pypi.org/p/pymargins
    permissions:
      id-token: write  # OIDC for Trusted Publishing; no token stored
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
