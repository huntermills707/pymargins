[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymargins"
version = "0.0.1"
description = "Expert-mode marginal effects for Python with session-level analytical pre-commitment."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Hunter Mills"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]

# Core runtime dependencies. JAX is required because the gradient/Hessian/
# diagnostic machinery is JAX-native. NumPy/SciPy/pandas are universal in
# this domain.
dependencies = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "threadpoolctl>=3.0",
]

[project.optional-dependencies]
# Per-framework dependencies are optional; users only need what they have.
statsmodels = ["statsmodels>=0.14", "patsy>=0.5"]
linearmodels = ["linearmodels>=5.0"]
lifelines = ["lifelines>=0.30"]
sklearn = ["scikit-learn>=1.3"]
polars = ["polars>=1.0", "pyarrow>=10.0"]
matching = ["pysmatch>=2.1"]

# Documentation (with executable notebooks)
docs = [
    "sphinx>=7.0",
    "myst-nb>=1.0",
    "sphinx-design>=0.5",
    "matplotlib>=3.5",
    "openpyxl>=3.0",
    "joblib>=1.0",
    # Include all modeling backends so every tutorial executes
    "statsmodels>=0.14",
    "patsy>=0.5",
    "linearmodels>=5.0",
    "lifelines>=0.30",
    "scikit-learn>=1.3",
    "polars>=1.0",
    "pyarrow>=10.0",
    "pysmatch>=2.1",
]

# Development / testing
test = [
    "pytest>=7.0",
    "pytest-cov",
    "hypothesis",
    "polars>=1.0",
    "pyarrow>=10.0",
    "pysmatch>=2.1",
]

[project.urls]
Homepage = "https://github.com/huntermill707/pymargins"
Documentation = "https://github.com/huntermill707/pymargins#readme"
Repository = "https://github.com/huntermill707/pymargins"

[tool.hatch.build.targets.wheel]
packages = ["pymargins"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter
