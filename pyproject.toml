[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymargins"
version = "0.3.0"
description = "Expert-mode marginal effects for Python with session-level analytical pre-commitment."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Hunter Mills"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]

# Core runtime dependencies. JAX is required because the gradient/Hessian/
# diagnostic machinery is JAX-native. NumPy/SciPy/pandas are universal in
# this domain.
dependencies = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "threadpoolctl>=3.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
# Per-framework dependencies are optional; users only need what they have.
statsmodels = ["statsmodels>=0.14", "patsy>=0.5"]
linearmodels = ["linearmodels>=5.0"]
lifelines = ["lifelines>=0.30"]
sklearn = ["scikit-learn>=1.3"]
polars = ["polars>=1.0", "pyarrow>=10.0"]
matching = ["pysmatch>=2.1"]

# Documentation (with executable notebooks)
docs = [
    "sphinx>=7.0",
    "myst-nb>=1.0",
    "sphinx-design>=0.5",
    "matplotlib>=3.5",
    "openpyxl>=3.0",
    "joblib>=1.0",
    # Include all modeling backends so every tutorial executes
    "statsmodels>=0.14",
    "patsy>=0.5",
    "linearmodels>=5.0",
    "lifelines>=0.30",
    "scikit-learn>=1.3",
    "polars>=1.0",
    "pyarrow>=10.0",
    "pysmatch>=2.1",
]

# Development / testing
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "polars>=1.0",
    "pyarrow>=10.0",
    "pysmatch>=2.1",
]

[project.urls]
Homepage = "https://github.com/huntermills707/pymargins"
Documentation = "https://pymargins.readthedocs.io"
Repository = "https://github.com/huntermills707/pymargins"
Changelog = "https://github.com/huntermills707/pymargins/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/huntermills707/pymargins/issues"

[tool.hatch.build.targets.wheel]
packages = ["pymargins"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 88
target-version = "py310"
# Generated/executed notebook cache — not source we lint.
extend-exclude = [".jupyter_cache", "docs/.jupyter_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501", "N803", "N806"]  # line length handled by formatter; math notation (X, S0_t, etc.) allowed

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "B017", "B018", "E721", "N802"]
# Demo scripts call jax.config.update(jax_enable_x64) before other imports.
"demo/**" = ["E402"]

[tool.mypy]
# Type-check our own package; we ship py.typed (PEP 561), so these annotations
# are part of the public contract and worth keeping coherent. Checks run against
# the CI runner's interpreter (3.12); no python_version pin so the analysis
# target matches the interpreter actually executing mypy.
files = ["pymargins"]
# Optional backends (jax, statsmodels, lifelines, linearmodels, sklearn,
# pysmatch, polars) ship no type stubs; don't fail on their unresolved imports.
ignore_missing_imports = true
# Starting posture is lenient: surface annotation incoherence without demanding
# full strictness on a codebase not originally built under a checker. Ratchet
# up over time (e.g. disallow_untyped_defs, warn_return_any).
